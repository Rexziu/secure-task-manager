<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secure Dynamic Task Manager</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <h1>Secure Dynamic Task Manager</h1>

    <section class="task-form">
      <input type="text" id="taskInput" placeholder="Enter a task" autocomplete="off">
      <button type="button" id="addTaskBtn">Add Task</button>
      <button type="button" id="loadSamplesBtn">Load Sample Tasks</button>
    </section>

    <p id="taskMessage" class="message" role="alert"></p>

    <section class="summary">
      <p>Total Tasks: <span id="totalCount">0</span></p>
      <p>Pending: <span id="pendingCount">0</span></p>
      <p>Completed: <span id="completedCount">0</span></p>
    </section>

    <ul id="taskList"></ul>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
